# /etc/vfio-passthrough.d/<profile-name>.conf
# Limine VFIO Device Passthrough Profile Template
# Profiles are automatically managed via 'limine-vfio add' and 'limine-vfio remove',
# but can also be manually created or edited.

# Unique profile identifier (used in bootloader entry names, e.g. linux-cachyos-lts-vfio-<profile>)
PROFILE="example"

# Classified device category: GPU, AUDIO, NETWORK, USB, STORAGE, CAPTURE, ACCELERATOR, SYSTEM
DEVICE_TYPE="GPU"

# Human-readable description
DESCRIPTION="Example PCI Device Passthrough"

# Comma-separated list of PCI Vendor:Device IDs to isolate with vfio-pci
# Note: All devices sharing the same IOMMU group must be included.
PCI_IDS="10de:1c03,10de:10f1"

# Enable or disable this profile (yes / no)
ENABLED="yes"
